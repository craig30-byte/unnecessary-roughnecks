<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unnecessary Roughnecks League</title>
    <style>
        :root {
            --oil-black: #121212;
            --shale-grey: #2b2b2b;
            --flare-orange: #ff5722;
            --industrial-gold: #ffc107;
            --text-light: #e0e0e0;
        }
        
        body {
            background-color: var(--oil-black);
            color: var(--text-light);
            font-family: 'Courier New', Courier, monospace; 
            margin: 0;
            padding: 20px;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--flare-orange);
            padding-bottom: 20px;
        }

        .main-league-logo {
            max-width: 200px; /* Reduced for layout balance */
            height: auto;
            margin-bottom: 15px;
        }
        
        h1 {
            color: var(--industrial-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .division-header {
            display: flex;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 15px;
        }

        .division-logo {
            width: 75px; /* Adjust size as needed */
            height: auto;
            margin-right: 15px;
        }
        
        h2 {
            color: var(--flare-orange);
            text-transform: uppercase;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .table-wrapper {
            overflow-x: auto;
            background-color: var(--shale-grey);
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        
        th {
            background-color: #1a1a1a;
            color: var(--industrial-gold);
            font-weight: bold;
        }
        
        td:first-child {
            text-align: left;
            font-weight: bold;
            color: white;
            white-space: nowrap;
        }
        
        tr:hover {
            background-color: #333;
        }
        
        .loading {
            text-align: center;
            color: var(--industrial-gold);
            font-style: italic;
            padding: 20px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        
        <div class="header-section">
            <!-- LEAGUE LOGO PLACEHOLDER -->
            <!-- Upload your league logo file (e.g., UFL-main-logo.png) to your repo -->
            <!-- And change src='' to reference the filename, like src='UFL-main-logo.png' -->
            <img id="league-logo-img" class="main-league-logo" src="" alt="">
            <h1>Unnecessary Roughnecks League</h1>
        </div>
        
        <div class="division-header">
            <!-- PERMIAN DIVISION LOGO PLACEHOLDER -->
            <!-- Same process: Change src='' below to reference your logo file, e.g., src='permian-logo.png' -->
            <img id="permian-logo-img" class="division-logo" src="" alt="">
            <h2>Permian Division Standings</h2>
        </div>
        <div class="table-wrapper">
            <div id="permian-container" class="loading">Establishing connection to the Permian Basin...</div>
        </div>
        
        <div class="division-header">
            <!-- POWDER RIVER DIVISION LOGO PLACEHOLDER -->
            <!-- Same process: Change src='' below to reference your logo file, e.g., src='powder-river-logo.png' -->
            <img id="powder-logo-img" class="division-logo" src="" alt="">
            <h2>Powder River Division Standings</h2>
        </div>
        <div class="table-wrapper">
            <div id="powder-container" class="loading">Establishing connection to the Powder River Rig...</div>
        </div>
    </div>

    <script>
        // --- 1. SET YOUR LOGO LINKS HERE ---
        // Option A (Recommended): Generate logos, upload to GitHub, and change to filenames:
        // Example: const leagueLogoLink = 'UFL-main-logo.png';
        
        // Option B: Paste external URLs (e.g., from Imgur) inside the single quotes:
        // Example: const leagueLogoLink = 'https://i.imgur.com/your-image-id.png';
        
        const leagueLogoLink = ''; // REPLACE THIS
        const permianLogoLink = ''; // REPLACE THIS
        const powderLogoLink = ''; // REPLACE THIS
        
        // --- 2. END OF LOGO CONFIGURATION (Do not edit below this line) ---

        // Google published CSV
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKp2B5o_bAqMuea_pBesEUoNxrk9BmlHlyGCQUkxj0Y5nPWXmqVEw0vuyQ4tH1w8z-7aCKbMGSiUW6/pub?gid=669905413&single=true&output=csv";

        // Inject logo links into placeholders
        if(leagueLogoLink) document.getElementById('league-logo-img').src = leagueLogoLink;
        if(permianLogoLink) document.getElementById('permian-logo-img').src = permianLogoLink;
        if(powderLogoLink) document.getElementById('powder-logo-img').src = powderLogoLink;

        async function fetchAndRenderData() {
            try {
                const response = await fetch(sheetUrl);
                const csvText = await response.text();
                
                // Parse CSV by rows
                const rows = csvText.split(/\r?\n/).map(row => {
                    return row.split(',').map(cell => cell.replace(/(^"|"$)/g, '').trim());
                });
                
                // Starts at Row 3 (Index 2), length 8
                // Starts at Row 14 (Index 13), length 8
                const permianData = rows.slice(2, 10);
                const powderData = rows.slice(13, 21);

                function buildTable(data) {
                    let html = '<table><thead><tr><th>Team Name</th>';
                    for(let i = 1; i <= 13; i++) {
                        html += `<th>Wk ${i}</th>`;
                    }
                    html += '</tr></thead><tbody>';
                    
                    data.forEach(row => {
                        if(row.length === 0 || !row[0]) return;
                        html += '<tr>';
                        for(let i = 0; i <= 13; i++) {
                            const val = row[i] ? row[i] : '-';
                            html += `<td>${val}</td>`;
                        }
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                    return html;
                }

                document.getElementById('permian-container').innerHTML = buildTable(permianData);
                document.getElementById('powder-container').innerHTML = buildTable(powderData);
                
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('permian-container').innerHTML = "Error loading connection. Check wellhead sensors.";
                document.getElementById('powder-container').innerHTML = "Error loading connection. Check wellhead sensors.";
            }
        }

        fetchAndRenderData();
    </script>
</body>
</html>
